<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Literal</title>
</head>
<body>
    <script>
        let obj = {
            item : "Pen",
            price : 10,
        };

        let specialstring = `This is a string`;
        document.write(specialstring + "<br>");

        //lets you write easily (access)
        let output = `the cost of ${obj.item} is ${obj.price} rupees`;
        document.write(output);
        
    </script>
</body>
</html>
