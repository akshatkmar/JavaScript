<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function Greet(name) {
            console.log("Hello " + name);
        }
        Greet("Akshat Singh");

        function add(a, b) {
            return a + b;
        }
        x = add(4, 5);
        console.log(x);

        //function expression
        const greet = function () {
            console.log("Plus Ultra!");
        }
        greet();

        //arrow function
        const hello = () => {
            console.log("Hello");
        };

        hello();
    </script>
</body>

</html>
