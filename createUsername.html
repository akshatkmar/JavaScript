<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Username</title>
</head>

<body>
    <script>
        let enterName = prompt("Enter your username :");
        let str1 = "@";
        let username = str1 + enterName + enterName.length;
        document.write(username);
    </script>
</body>

</html>
