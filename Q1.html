<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    //avaerage of the class
    let n = Number(prompt("Number of students:"));
    let marks = [];
    let sum = 0;

    for (let i = 0; i < n; i++) {
        marks[i] = Number(prompt("Enter marks of Student " + (i + 1) + ":"));
        sum += marks[i];
    }

    let avg = sum / n;

    document.write("Average marks of class is " + avg);
</script>

<body>

</body>

</html>
