<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <h2 class="text-center">Text Centre</h2>
    <h3 class="text-start">Text Start</h3>
    <h4 class="text-end">Text End</h4>
    <h4 class="text-primary">Text Primary</h4> <!-- turns blue -->
    <h4 class="text-secondary">Text Secondary</h4> <!-- turns grey -->
    <h4 class="text-warning">Text Warning</h4> <!--turns yellow-->
    <h4 class="text-danger text-end">Text Danger</h4> <!--turns Red -->
    <h4 class="text-dark">Text Dark</h4> <!--turns Black -->
    <h4 class="text-info text-center">Text Info</h4> <!--turns sky -->
    <p class="display-1">Hello</p>
    <p class="display-2">World</p>
    <p class="display-3">How are you?</p>
</body>
</html>
